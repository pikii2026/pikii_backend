spring:
  application:
    name: Pickii
  profiles:
    default: local
  jackson:
    # API_SPEC 0.4 Null Policy: null 필드는 응답에서 제외
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 5장 Master Data 캐싱(API_SPEC). Redis는 Redis_Policy.md상 인증/세션 전용이라
  # 마스터 데이터는 별도 역할 확장 없이 인메모리 캐시로 처리한다.
  # (spring-boot-starter-data-redis가 클래스패스에 있으면 Spring Boot가 기본값을
  # Redis 캐시로 자동 선택하므로 명시적으로 simple로 고정해야 한다.)
  cache:
    type: simple
  data:
    # Redis는 StringRedisTemplate으로만 사용하고 Repository는 쓰지 않는다(Redis_Policy.md).
    # 켜두면 부팅 때 모든 Repository를 훑으며 "내 것이 아니다" 로그만 45줄 남긴다.
    redis:
      repositories:
        enabled: false

  # JWT 인증만 사용하므로 Spring Security 기본 인메모리 계정(및 임시 비밀번호 로그)이 필요 없다
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 8083
  servlet:
    # API_SPEC 0.1 Base URL: http://localhost:8080/api/v1
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET}
  # Access Token 유효시간(초) - API_SPEC 0.9: 30분
  access-token-validity: 1800
  # Refresh Token 유효시간(초) - REDIS_POLICY: autoLogin=false 1일 / true 30일
  refresh-token-validity: 86400
  refresh-token-validity-auto-login: 2592000

# 메일 발송 방식: smtp(기본, 로컬 Gmail) | brevo(Railway 등 SMTP 차단 환경용 HTTPS API)
app:
  mail:
    provider: smtp
    sender-name: Pickii
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    brevo-api-key: ${BREVO_API_KEY:}

  # 업로드 이미지 저장소: local(기본, 파일시스템) | s3(Railway Buckets 등 S3 호환)
  # 배포 환경의 컨테이너 파일시스템은 재배포 시 초기화되므로 반드시 s3를 사용한다.
  storage:
    provider: local
    local-path: uploads
    bucket: ${AWS_S3_BUCKET_NAME:}
    endpoint: ${AWS_ENDPOINT_URL:}
    region: ${AWS_DEFAULT_REGION:auto}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

# AI 연동 (공고초안/지원메시지/자기소개/상호평가요약) - Gemini (무료 티어)
# gemini-2.5-flash/-lite, gemini-2.0-flash는 이 API 키(신규 발급)에서 각각 404(신규 사용자 미제공)/429(무료 쿼터 0)로 막혀 있어 사용 불가 확인됨(2026-08-07).
# ListModels로 확인한 사용 가능 모델 중 gemini-3-flash-preview만 정상 응답.
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3-flash-preview}

# 시스템 푸시(FCM) 연동 - 서비스 계정 키 JSON 원문. 미설정 시 푸시 발송은 비활성화된다(서버 부팅에는 영향 없음)
fcm:
  credentials-json: ${FCM_CREDENTIALS_JSON:}

logging:
  level:
    # Spring Data 모듈이 여러 개(JPA/MongoDB)라 부팅 때 각 모듈이 모든 Repository를 훑으며
    # "이건 내 것이 아니다" INFO 로그를 남긴다. 실제 문제가 아니므로 WARN 이상만 남긴다.
    org.springframework.data.repository.config: WARN
