services:
  mysql:
    image: mysql:8.0
    container_name: pickii-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pickii1234}
      MYSQL_DATABASE: pickii
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-pickii1234}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pickii-redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:7
    container_name: pickii-mongo
    ports:
      - "27017:27017"
    environment:
      TZ: Asia/Seoul
    volumes:
      - mongo-data:/data/db

volumes:
  mysql-data:
  mongo-data:
